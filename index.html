<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ResumeCollection - 简历模板大全</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* =========================================
       1. 彻底清理顶部：只保留导航栏
       ========================================= */
    /* 隐藏大标题（💻 简历收集 🔥） */
    div[align="center"] > h1 {
      display: none !important;
    }
    
    /* 隐藏第二个分割线及它下面的所有文字、徽章、换行 */
    div[align="center"] > hr:nth-of-type(2),
    div[align="center"] > hr:nth-of-type(2) ~ * {
      display: none !important;
    }

    /* =========================================
       2. 简历列表网格化改造（去掉表格线和下载列）
       ========================================= */
    /* 隐藏表格原本的表头 */
    table thead {
      display: none !important;
    }

    /* 将表格强制转换为两列网格布局 */
    table {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important; 
      gap: 25px 10px !important; 
      width: 100% !important;
      border: none !important;
      background: transparent !important;
      margin-top: 20px !important;
    }

    /* 抽离表格的行列属性 */
    table tbody, table tr {
      display: contents !important; 
    }

    /* 设置每个格子的样式 */
    table td {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      padding: 0 !important;
      border: none !important;
      background: transparent !important;
      width: 100% !important;
    }

    /* 隐藏第2列和第4列（下载链接） */
    table td:nth-child(2), table td:nth-child(4) {
      display: none !important;
    }

    /* 图片自适应并添加圆角阴影 */
    table img {
      max-width: 100% !important;
      height: auto !important;
      border-radius: 8px !important; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.08) !important; 
    }

    /* 调整简历标题文字样式 */
    table p {
      text-align: center !important;
      font-size: 14px !important;
      margin: 10px 0 0 0 !important;
      color: #333 !important;
      line-height: 1.4 !important;
      font-weight: bold !important;
    }

    /* 优化页面边距 */
    .content {
      padding: 15px 10px !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script>
    window.$docsify = {
      name: 'ResumeCollection',
      repo: 'vod88/ResumeCollection',
      loadSidebar: true, 
      subMaxLevel: 2
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
