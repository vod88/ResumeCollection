<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ResumeCollection - 简历模板大全</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    /* =========================================
       1. 清理与隐藏
       ========================================= */
    /* 隐藏左上角侧边栏按钮及侧边栏 */
    .sidebar, .sidebar-toggle { display: none !important; }
    .content { left: 0 !important; }

    /* 隐藏大标题（💻 简历收集 🔥） */
    div[align="center"] > h1 { display: none !important; }
    
    /* 隐藏第二个分割线及它下面的所有文字、徽章、换行（保留上面的导航） */
    div[align="center"] > hr:nth-of-type(2),
    div[align="center"] > hr:nth-of-type(2) ~ * {
      display: none !important;
    }

    /* =========================================
       2. 响应式网格布局 (自动适应手机、平板、电脑)
       ========================================= */
    /* 隐藏表格表头 */
    table thead { display: none !important; }

    /* 将表格转为网格布局 */
    table {
      display: grid !important;
      /* 魔法代码：每列最小140px，手机自动2列，电脑自动多列 */
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)) !important; 
      gap: 15px !important;
      width: 100% !important;
      border: none !important;
      background: transparent !important;
      margin-top: 15px !important;
    }

    table tbody, table tr { display: contents !important; }

    /* 卡片样式 */
    table td {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      padding: 0 !important;
      border: none !important;
      background: transparent !important;
      width: 100% !important;
      margin-bottom: 10px !important;
    }

    /* 隐藏下载列 */
    table td:nth-child(2), table td:nth-child(4) { display: none !important; }

    /* 图片自适应 */
    table img {
      width: 100% !important;
      height: auto !important;
      border-radius: 6px !important; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.1) !important; 
      cursor: zoom-in; /* 鼠标放上去变成放大镜 */
      transition: transform 0.2s;
    }
    
    table img:hover { transform: scale(1.02); }

    /* 文字标题 */
    table p {
      display: block !important;
      font-size: 13px !important;
      font-weight: bold !important;
      margin: 8px 0 0 0 !important;
      color: #333 !important;
      text-align: center !important;
      line-height: 1.4 !important;
    }

    /* =========================================
       3. 自定义图片放大遮罩层样式
       ========================================= */
    #custom-lightbox {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      opacity: 0;
      animation: fadeIn 0.2s forwards;
    }
    #custom-lightbox img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* 页面边距 */
    .markdown-section { max-width: 100% !important; padding: 10px !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script>
    window.$docsify = {
      name: '',
      // 去除了 repo 和 loadSidebar
      plugins: [
        function(hook) {
          hook.doneEach(function() {
            // 1. 清理残留文字
            const content = document.querySelector('.markdown-section');
            if (content) {
              let html = content.innerHTML;
              html = html.replace(/若出现兼容性问题，请自行修改后缀名/g, '');
              html = html.replace(/docx<=>doc/g, '');
              content.innerHTML = html;
            }

            // 2. 绑定图片点击放大事件
            const imgs = document.querySelectorAll('.markdown-section table img');
            imgs.forEach(img => {
              img.addEventListener('click', function(e) {
                // 防止重复创建
                if (document.getElementById('custom-lightbox')) return;

                // 创建遮罩层
                const lightbox = document.createElement('div');
                lightbox.id = 'custom-lightbox';
                
                // 创建大图
                const largeImg = document.createElement('img');
                largeImg.src = this.src;
                
                lightbox.appendChild(largeImg);
                document.body.appendChild(lightbox);

                // 点击遮罩层关闭
                lightbox.addEventListener('click', function() {
                  this.remove();
                });
              });
            });
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
